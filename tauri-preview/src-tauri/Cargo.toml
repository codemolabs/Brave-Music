[package]
name = "brave-music-linux-preview"
version = "1.0.19-r"
description = "Rust and Tauri Linux native stack for Brave Music"
authors = ["Codemo Open Source Labs"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset", "unstable"] }
tauri-runtime = "2.12"
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-opener = "2"
brave-music-core = { path = "../../crates/brave-music-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["time", "rt"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

[dev-dependencies]

