name: brave-music
base: core24
version: '1.0.19-r'
summary: Ad-free YouTube Music, Spotify & Offline Music OTT Platform
description: |
  Brave Music is a high-performance, open-source Linux desktop Music OTT platform
  developed by Codemo Open Source Labs (COSL). It brings together ad-free YouTube
  Music, a native Rust/Tauri + WebKitGTK desktop shell, a local high-bitrate audio
  downloader (yt-dlp + ffmpeg), Spotify metadata/playlist queue resolution, and an
  integrated offline music library with zero Electron/Chromium runtime overhead.

  Key Features:
  - Unified Navigation: Switch seamlessly between YouTube Music, Spotify Web,
    Downloads, and Offline Library.
  - Brave Shields Integration: Built-in network-level ad-blocking and cosmetic
    scriptlet filtering for uninterrupted streaming.
  - Native Rust + WebKitGTK Runtime: Fast startup, low memory footprint, and
    built-in secure sign-in without deprecated Electron wrappers.
  - 100% Local & Privacy-First: Zero telemetry, zero analytics, and no cloud
    tracking.
license: GPL-3.0+
icon: src/assets/app-icon.png
website: https://github.com/codemolabs/Brave-Music
source-code: https://github.com/codemolabs/Brave-Music
issues: https://github.com/codemolabs/Brave-Music/issues
contact: mailto:cosl@codemoteams.org
grade: stable
confinement: strict
compression: lzo

platforms:
  amd64:

slots:
  mpris:
    interface: mpris

layout:
  /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1:
    bind: $SNAP/gnome-platform/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1

apps:
  brave-music:
    command: bin/brave-music-snap
    extensions: [gnome]
    desktop: usr/share/applications/brave-music.desktop
    common-id: org.codemolabs.BraveMusic
    slots:
      - mpris
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - audio-playback
      - pulseaudio
      - network
      - network-bind
      - home
      - removable-media
      - screen-inhibit-control

parts:
  brave-music:
    plugin: dump
    source: .
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/opt/brave-music/backend/bin
      mkdir -p $CRAFT_PART_INSTALL/bin
      mkdir -p $CRAFT_PART_INSTALL/usr/share/applications
      mkdir -p $CRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps

      cargo build --release --manifest-path tauri-preview/src-tauri/Cargo.toml
      cp tauri-preview/src-tauri/target/release/brave-music-linux-preview $CRAFT_PART_INSTALL/opt/brave-music/brave-music-linux-preview
      chmod +x $CRAFT_PART_INSTALL/opt/brave-music/brave-music-linux-preview

      cp -r backend/bin $CRAFT_PART_INSTALL/opt/brave-music/backend/
      cp src/assets/app-icon.png $CRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps/brave-music.png
      chmod +x $CRAFT_PART_INSTALL/opt/brave-music/backend/bin/yt-dlp \
               $CRAFT_PART_INSTALL/opt/brave-music/backend/bin/node \
               $CRAFT_PART_INSTALL/opt/brave-music/backend/bin/ffmpeg \
               $CRAFT_PART_INSTALL/opt/brave-music/backend/bin/ffprobe 2>/dev/null || true

      cat << 'EOF' > $CRAFT_PART_INSTALL/bin/brave-music-snap
      #!/bin/bash
      APP_DIR="${SNAP}/opt/brave-music"
      export PATH="$APP_DIR/backend/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
      export LD_LIBRARY_PATH="${SNAP:+$SNAP/gnome-platform/usr/lib/x86_64-linux-gnu:$SNAP/gnome-platform/lib/x86_64-linux-gnu:}$APP_DIR/backend/bin:${LD_LIBRARY_PATH:-}"
      export WEBKIT_EXEC_PATH="${SNAP}/gnome-platform/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1"
      exec "$APP_DIR/brave-music-linux-preview" "$@"
      EOF
      chmod +x $CRAFT_PART_INSTALL/bin/brave-music-snap

      cat << 'EOF' > $CRAFT_PART_INSTALL/usr/share/applications/brave-music.desktop
      [Desktop Entry]
      Name=Brave Music
      Comment=Ad-free Music OTT Platform with YouTube, Spotify & Offline Player
      Exec=brave-music %U
      Icon=${SNAP}/meta/gui/icon.png
      Terminal=false
      Type=Application
      Categories=AudioVideo;Audio;Player;
      StartupWMClass=brave-music
      StartupNotify=true
      Keywords=Music;YouTube;Spotify;Download;Audio;Player;
      EOF
    stage-packages:
      - python3
      - curl
      - ca-certificates
