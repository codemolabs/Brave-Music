name: Feature Request
description: Propose an idea, new integration, or enhancement for Brave Music.
title: "[FEATURE]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve Brave Music? We welcome proposals that align with our roadmap in [docs/CONTRIBUTION.md](../docs/CONTRIBUTION.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific problem or limitation?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe what you want to happen and how it should look or function.
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target Platform
      options:
        - Linux Desktop
        - Android Milestone
        - Windows (Roadmap)
        - macOS
        - Backend / C++ Audio Engine
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
  - type: checkboxes
    id: contribute
    attributes:
      label: Willingness to Contribute
      options:
        - label: I am willing to submit a Pull Request to help implement this!
