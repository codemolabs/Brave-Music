name: Bug Report
description: Report an issue, streaming error, playback failure, or packaging defect.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue to Brave Music. Please check existing issues and [docs/INSTALL.md](../docs/INSTALL.md) before submitting.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise explanation of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce the issue?
      placeholder: |
        1. Launch Brave Music desktop app
        2. Select Spotify tab
        3. Observe audio playback error
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - YouTube Music Webview
        - Spotify Web Player / Widevine DRM
        - Brave Shields Ad-Blocking
        - Offline Downloader (yt-dlp)
        - Embedded Musikcube Audio Engine
        - Debian Package (.deb)
        - Windows Installer (.exe / .zip)
        - npm / npx Package
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: System Environment
      description: Operating system, audio server, and versions.
      placeholder: |
        - OS: Ubuntu 24.04 LTS (x86_64) or Windows 11
        - Sound Server / Audio: PipeWire / PulseAudio / WASAPI
        - Brave Music Version: v1.0.18
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste terminal output, error logs, or attach screenshots. (Do NOT include private credentials or tokens).
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Contributor Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I have not included any sensitive personal data, secrets, or API tokens.
          required: true
