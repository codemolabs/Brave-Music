name: Publish to GitHub Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish @codemolabs/brave-music to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@codemolabs'

      - name: Configure Registry Authentication
        run: |
          echo "@codemolabs:registry=https://npm.pkg.github.com" > .npmrc
          echo "@codemoteams:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          echo "//npm.pkg.github.com/:always-auth=true" >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Publish to GitHub Packages
        run: |
          CURRENT_VER=$(node -p "require('./package.json').version")
          echo "Current package version: $CURRENT_VER"
          if npm view @codemolabs/brave-music@$CURRENT_VER version >/dev/null 2>&1; then
            echo "Version $CURRENT_VER is already published on GitHub Packages."
          else
            echo "Publishing version $CURRENT_VER to GitHub Packages..."
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
