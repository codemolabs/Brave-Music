name: Release Brave Music

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release (Linux Debian)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev yt-dlp python3-pip

      - name: Install Node Dependencies
        run: npm install

      - name: Build Linux Debian Package
        run: bash Install/Linux/build-deb.sh

      - name: Generate Checksums
        run: |
          sha256sum Install/Linux/brave-music_*_amd64.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Brave Music ${{ github.ref_name }} (Linux)
          tag_name: ${{ github.ref_name }}
          files: |
            Install/Linux/brave-music_*_amd64.deb
            SHA256SUMS.txt
          draft: false
          prerelease: false
          body: |
            ## Brave Music ${{ github.ref_name }} Stable Release

            Provider: **Codemo Open Source Labs (COSL)** — [https://github.com/codemolabs](https://github.com/codemolabs)
            Official Repository: [https://github.com/codemolabs/Brave-Music](https://github.com/codemolabs/Brave-Music)

            ### Highlights & What's New:
            - **Modern Native Stack**: High-performance Rust & native webview foundation alongside legacy Electron runner.
            - **Ultra-Smooth 60fps Scrolling**: Hardware-accelerated compositing and elimination of virtual-scroll conflicts.
            - **Linux Debian Package (`.deb`)**: Full 64-bit Debian/Ubuntu package bundling seamless ad-free YouTube Music, Spotify Web, and offline playback.
            - **Zero Telemetry**: All operations run 100% locally on the user end without analytics, telemetry, or forced background tracking.
            - **Native Desktop Integration**: Linux MPRIS2 media controller and tray synchronization.
